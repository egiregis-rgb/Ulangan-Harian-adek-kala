let h=`<section id="s${si}" hidden><h2 style="color:${s.c}">${s.ic} ${s.n} – ${s.t}</h2><h3>A. Pilihan Ganda (15 soal)</h3>`;
mc.forEach((q,i)=>{h+=`<div class="card" id="c${si}_${i}"><div class="q">${i+1}. ${q.q}${q.img&&!q.img.startsWith('e:')?`<img src="${IM[q.img]}" alt="">`:q.img?`<span class="emo">${q.img.slice(2)}</span>`:''}</div>`+
q.o.map((t,j)=>`<label class="opt" id="o${si}_${i}_${j}"><input type="radio" name="q${si}_${i}" value="${j}"> ${'ABC'[j]}. ${t}</label>`).join('')+'</div>'});
h+=`<h3>B. Mencocokkan Gambar dengan Jawaban (10 soal)</h3><p>Pilih jawaban yang tepat untuk setiap gambar.</p>`;
s.mt.forEach((x,i)=>{h+=`<div class="card mt" id="t${si}_${i}"><b>${i+16}.</b>${pic(x[0])}<select id="m${si}_${i}"><option value="">-- pilih jawaban --</option>${s.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`});
h+=`<button class="btn" style="background:${s.c}" id="b${si}" onclick="fin(${si})">✅ Selesai & Lihat Nilai</button><div id="r${si}"></div></section>`;m.insertAdjacentHTML('beforeend',h)})}
function show(i){cur=i;document.querySelectorAll('main section').forEach((e,k)=>e.hidden=k!=i);[...tabs.children].forEach((b,k)=>b.classList.toggle('on',k==i));scrollTo(0,0)}
function fin(si){const s=D[si];let ok=0,key='<h3>🔑 Kunci Jawaban</h3><div class="key"><b>Pilihan Ganda</b>';
S[si].forEach((q,i)=>{const v=document.querySelector(`input[name=q${si}_${i}]:checked`);const g=v?+v.value:-1;
if(g==q.a)ok++;document.getElementById(`o${si}_${i}_${q.a}`).classList.add('ok');if(g>=0&&g!=q.a)document.getElementById(`o${si}_${i}_${g}`).classList.add('bad');
key+=`<p>${i+1}. ${'ABC'[q.a]}. ${q.o[q.a]} ${g==q.a?'✅':'❌'}</p>`});
key+='<b>Mencocokkan</b>';
s.mt.forEach((x,i)=>{const e=document.getElementById(`m${si}_${i}`),r=e.value==x[1];if(r)ok++;e.style.borderColor=r?'#2f9e44':'#e03131';
key+=`<p>${i+16}. ${x[1]} ${r?'✅':'❌'}</p>`});
document.querySelectorAll(`#s${si} input,#s${si} select`).forEach(e=>e.disabled=true);document.getElementById('b'+si).style.display='none';
const sc=Math.max(1,Math.round(ok/25*100));
let msg=sc>=90?'Luar biasa! Kamu hebat sekali! 🌟':sc>=75?'Hebat! Pertahankan ya! 👏':sc>=60?'Bagus! Terus berlatih ya! 💪':'Jangan menyerah, ayo belajar lagi! 😊';
document.getElementById('r'+si).innerHTML=`<div class="card res"><div style="font-size:3rem">${sc>=75?'🏆':'⭐'}</div><div>Benar: ${ok} dari 25 soal</div><div class="score" style="color:${s.c}">${sc}</div>
<p>🎉 Selamat <b>${name}</b>, kamu mendapatkan nilai <b>${sc}</b> pada ${s.n}!<br>${msg}</p></div><div class="card">${key}</div></div>`;
document.getElementById('r'+si).scrollIntoView({behavior:'smooth'})}
</script></body></html>
